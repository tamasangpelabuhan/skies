<title>Skies by Nas</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F5F1FF;--side:#C9CFF2;--card:#fff;--lav:#E4DCFB;--pur:#B7A3F2;--deep:#4A3A85;--ink:#2F2552;--mut:#7B6FA3;--yel:#FFE59A;--yel2:#FFF4CC;--line:#E7DFFB;--on:#7ED6A5;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#241D3F;--side:#171230;--card:#322957;--lav:#41366E;--pur:#8E79DB;--deep:#E4DCFB;--ink:#F3EEFF;--mut:#B3A7DA;--yel:#FFE59A;--yel2:#4B4170;--line:#443A75}}
:root[data-theme="dark"]{--bg:#241D3F;--side:#171230;--card:#322957;--lav:#41366E;--pur:#8E79DB;--deep:#E4DCFB;--ink:#F3EEFF;--mut:#B3A7DA;--yel:#FFE59A;--yel2:#4B4170;--line:#443A75}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--side);color:var(--ink);font:500 14px/1.45 Nunito,system-ui,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
h1,h2,h3,.f{font-family:Fredoka,"Trebuchet MS",sans-serif;margin:0}
#app{max-width:440px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative;padding-bottom:96px;box-shadow:0 0 40px rgba(74,58,133,.18)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--deep);outline-offset:2px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:10px;padding:12px 16px}
.top img{width:42px;height:42px;border-radius:50%;border:2px solid var(--pur)}
.top h1{font-size:19px;font-weight:700;color:var(--deep);line-height:1.1}
.top small{color:var(--mut);font-weight:700;font-size:11.5px}
.pill{margin-left:auto;display:flex;align-items:center;gap:6px;background:var(--yel2);color:var(--ink);border:1.5px solid var(--yel);border-radius:99px;padding:5px 11px;font-weight:800;font-size:12px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--on)}.off .dot{background:#C9B8E8}
.back{display:flex;align-items:center;gap:6px;padding:14px 16px 2px;font-weight:800;color:var(--deep)}
main{padding:0 16px}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:22px 0 10px}
.sec h2{font-size:18px;color:var(--deep)}.sec a{font-size:12px;font-weight:800;color:var(--mut);cursor:pointer}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:20px;padding:14px}
.ban{width:100%;border-radius:20px;display:block;border:1.5px solid var(--line)}
.hero{background:var(--pur);color:#2F2552;border-radius:24px;padding:20px;margin-top:12px;position:relative;overflow:hidden}
.hero h2{font-size:27px;line-height:1.1;font-weight:700;max-width:230px}
.hero p{max-width:240px;margin:8px 0 14px;font-weight:700}
.star{position:absolute;background:var(--yel);clip-path:polygon(50% 0,62% 36%,100% 38%,70% 60%,80% 100%,50% 76%,20% 100%,30% 60%,0 38%,38% 36%)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:99px;padding:11px 20px;font-weight:800;background:var(--deep);color:var(--bg)}
.btn.y{background:var(--yel);color:#2F2552}.btn.w{width:100%;padding:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pc{position:relative;text-align:left;display:flex;flex-direction:column;gap:2px;padding:12px}
.ico{width:100%;aspect-ratio:1.25;border-radius:16px;display:grid;place-items:center;font-size:44px;margin-bottom:8px}
.pc b{font-family:Fredoka,sans-serif;font-size:15px;color:var(--ink)}.pc small{color:var(--mut);font-weight:700}
.pc .pr{margin-top:4px;font-weight:800;color:var(--deep)}
.hrt{position:absolute;top:18px;right:18px;width:30px;height:30px;border-radius:50%;background:var(--card);font-size:15px}
.ft{display:flex;gap:12px;align-items:flex-start;padding:10px 0}.ft+.ft{border-top:1.5px dashed var(--line)}
.ft i{font-style:normal;width:36px;height:36px;flex:none;border-radius:12px;background:var(--yel2);display:grid;place-items:center}
.ft b{display:block}.ft span{color:var(--mut);font-weight:700;font-size:13px}
.rate{display:flex;align-items:center;gap:10px;margin-bottom:10px}.rate b{font:700 34px Fredoka,sans-serif;color:var(--deep)}
.stars{color:#F3B62E;letter-spacing:2px}
.rv{margin-bottom:10px}.rv div{display:flex;justify-content:space-between;font-weight:800}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px}
.chip{flex:none;border-radius:99px;padding:7px 14px;font-weight:800;background:var(--card);border:1.5px solid var(--line);color:var(--mut)}
.chip.on{background:var(--deep);color:var(--bg);border-color:var(--deep)}
.in{width:100%;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:12px 14px;font:inherit;margin-top:6px}
.in{font-family:inherit}textarea.in{min-height:84px;resize:vertical}.lb{font-weight:800;margin-top:12px;display:block}.hint{color:var(--mut);font-size:12px;font-weight:700}
.opt{display:flex;align-items:center;gap:10px;width:100%;text-align:left;margin-bottom:8px;border:2px solid var(--line);background:var(--card);border-radius:16px;padding:12px 14px}
.opt.on{border-color:var(--deep);background:var(--yel2)}.opt b{margin-left:auto;color:var(--deep)}
.opt .rd{width:18px;height:18px;border-radius:50%;border:2px solid var(--pur);flex:none}.opt.on .rd{background:var(--deep);border-color:var(--deep);box-shadow:inset 0 0 0 3px var(--yel2)}
.row{display:flex;justify-content:space-between;padding:5px 0;font-weight:700}.row.t{border-top:1.5px dashed var(--line);margin-top:6px;padding-top:10px;font:700 17px Fredoka,sans-serif;color:var(--deep)}
.st{border-radius:99px;padding:3px 10px;font-size:11.5px;font-weight:800;background:var(--yel);color:#2F2552}.st.ok{background:#CDEFD9}.st.pr{background:var(--lav)}
.od{margin-bottom:12px}.od .h{display:flex;justify-content:space-between;color:var(--mut);font-weight:800;font-size:12px;margin-bottom:8px}
.wa{background:var(--deep);color:var(--bg);border-radius:22px;padding:18px}.wa h3{font-size:19px}.wa p{margin:4px 0 12px;opacity:.85}
.q3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}.q3 a{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:12px 4px;text-align:center;font-weight:800;color:var(--ink);text-decoration:none}
details{border-top:1.5px dashed var(--line);padding:10px 0}details:first-of-type{border:0}summary{font-weight:800;cursor:pointer}details p{margin:6px 0 0;color:var(--mut);font-weight:700}
.step{display:flex;gap:12px;align-items:center;padding:8px 0}.step i{font:700 14px Fredoka;font-style:normal;width:30px;height:30px;border-radius:50%;background:var(--yel);color:#2F2552;display:grid;place-items:center;flex:none}
.pd{display:flex;gap:14px;align-items:center}.pd .ico{width:84px;aspect-ratio:1;font-size:40px;margin:0}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:440px;background:var(--card);border-top:1.5px solid var(--line);display:flex;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));z-index:6}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 0;border-radius:14px;font-size:11.5px;font-weight:800;color:var(--mut)}nav button span{font-size:19px}
nav button.on{background:var(--yel);color:#2F2552}
.cta{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:440px;background:var(--card);border-top:1.5px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));z-index:6}
.md{position:fixed;inset:0;background:rgba(47,37,82,.55);z-index:20;display:grid;place-items:center;padding:20px}.md .card{max-width:380px;text-align:center;padding:22px}
.empty{text-align:center;color:var(--mut);font-weight:700;padding:28px 10px}.empty div{font-size:40px}
@media (prefers-reduced-motion:no-preference){.hero .star{animation:tw 3s ease-in-out infinite}@keyframes tw{50%{transform:rotate(14deg) scale(1.1)}}}
.num{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--yel);color:#2F2552;font-size:15px;margin-right:6px}
.gh{display:flex;justify-content:space-between;align-items:center;margin:16px 0 8px}
.pk{flex-direction:column;align-items:flex-start;margin:0;min-height:96px;position:relative;gap:4px}.pk b{margin:auto 0 0}.sold{opacity:.55}.so{font-size:11px;font-weight:800;background:var(--lav);border-radius:99px;padding:2px 8px}
.qty{display:flex;align-items:center;gap:14px}.qty button{width:34px;height:34px;border-radius:50%;background:var(--yel);color:#2F2552;font-size:20px;font-weight:800}
details.ad{border:1.5px solid var(--line);border-radius:18px;padding:12px 14px;margin-bottom:10px;background:var(--card)}details.ad summary{font:600 16px Fredoka,sans-serif;color:var(--deep)}
</style></head><body>

const hp=s.faq.map((q,i)=>`<div class="card" style="margin-top:10px;background:var(--bg)">${I('s.faq.'+i+'.0','Pertanyaan',q[0])}${TA('s.faq.'+i+'.1','Jawaban',q[1])}<button class="chip" style="margin-top:8px" onclick="rm('s.faq',${i})">Hapus</button></div>`).join('')+`<button class="chip on" style="margin-top:10px" onclick="ad('s.faq',['Pertanyaan baru','Jawaban'])">+ Pertanyaan</button>`+TA('s.garansi','Teks garansi',s.garansi);
const ct=CATS.map((c,i)=>I('cats.'+i+'.1','Nama kategori '+(i+1),c[1])).join('');
const py=D.pay.map((m,i)=>`<div class="card" style="margin-top:10px;background:var(--bg)">${I('pay.'+i+'.0','Nama metode',m[0])}${I('pay.'+i+'.1','Keterangan',m[1])}${G2(I('pay.'+i+'.2','Emoji',m[2]),NI('pay.'+i+'.3','Biaya admin (Rp)',m[3]))}<button class="chip" style="margin-top:8px" onclick="D.pay.length>1?rm('pay',${i}):alert('Minimal 1 metode')">Hapus</button></div>`).join('')+`<button class="chip on" style="margin-top:10px" onclick="ad('pay',['Metode baru','Keterangan','💰',0])">+ Metode</button>`;
const pr=P.map((p,i)=>{const b='products.'+i;return DT('p'+p.id,esc(p.i)+' '+esc(p.n),I(b+'.n','Nama produk',p.n)+I(b+'.s','Keterangan singkat',p.s)
+`<div style="display:grid;grid-template-columns:1fr 2fr 1fr;gap:8px">${I(b+'.i','Emoji',p.i)}<label class="lb">Kategori<select class="in" onchange="set('${b}.cat',this.value)">${CATS.map(c=>`<option value="${c[0]}" ${c[0]===p.cat?'selected':''}>${esc(c[1])}</option>`).join('')}</select></label><label class="lb">Warna<input class="in" type="color" style="padding:3px;height:46px" value="${esc(p.c)}" oninput="set('${b}.c',this.value)"></label></div>`
+TA(b+'.d','Deskripsi',p.d)+`<label style="display:flex;gap:8px;margin:12px 0;font-weight:700"><input type="checkbox" ${p.ft?'checked':''} onchange="set('${b}.ft',this.checked)"> Tampilkan di Produk unggulan</label><b class="f">Kategori paket dan pilihan</b>`
+p.g.map((g,gi)=>{const c=b+'.g.'+gi;return`<div class="card" style="margin-top:10px;background:var(--bg)">${I(c+'.n','Nama kategori paket',g.n)}${g.items.map((it,ii)=>{const d=c+'.items.'+ii;return`<div style="border-top:1.5px dashed var(--line);margin-top:10px">${G2(I(d+'.n','Nama pilihan',it.n),NI(d+'.p','Harga (Rp)',it.p))}<div style="display:flex;align-items:center;gap:8px;margin-top:8px"><label style="display:flex;gap:6px;font-weight:700"><input type="checkbox" ${it.o?'checked':''} onchange="set('${d}.o',this.checked)">Sold out</label><button class="chip" style="margin-left:auto" onclick="rm('${c}.items',${ii})">Hapus pilihan</button></div></div>`}).join('')}<div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap"><button class="chip on" onclick="ad('${c}.items',{n:'Pilihan baru',p:10000,o:false})">+ Pilihan</button><button class="chip" onclick="rm('${b}.g',${gi},'Hapus kategori paket beserta isinya?')">Hapus kategori paket</button></div></div>`}).join('')
+`<div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap"><button class="chip on" onclick="ad('${b}.g',{n:'Kategori baru',items:[{n:'Pilihan baru',p:10000,o:false}]})">+ Kategori paket</button><button class="chip" onclick="rm('products',${i},'Hapus produk ini?')">Hapus produk</button></div>`)}).join('');
return`<div class="back"><button onclick="go('beranda')">← Panel admin</button></div><main><div class="card" style="margin:12px 0;background:var(--yel2);border-color:var(--yel)"><b class="f">Ubah apa saja, lalu simpan</b><div class="hint">Perubahan baru tampil ke pembeli setelah menekan Simpan &amp; publikasikan di bawah.</div></div>
${DT('st','🏪 Toko dan jam online',store)}${DT('hm','🏠 Tampilan beranda',hm)}${DT('hp','💬 Bantuan (FAQ dan garansi)',hp)}${DT('ct','🗂️ Nama kategori katalog',ct)}${DT('py','💳 Metode pembayaran',py)}
<div class="sec"><h2>Produk (${P.length})</h2><button class="chip on" onclick="addP()">+ Tambah produk</button></div>${pr}</main><div class="cta"><button class="btn w" id="pub" onclick="publishAll()">Simpan &amp; publikasikan</button></div>`}
async function publishAll(){const b=$('#pub'),t=b.textContent;
const bad=P.find(p=>!p.n.trim()||!p.g.some(g=>g.items.length)||p.g.some(g=>g.items.some(it=>!it.n.trim()||!(it.p>0))));
if(bad){alert('Cek lagi produk "'+(bad.n||'tanpa nama')+'": nama, pilihan, dan harga harus terisi.');return}
b.disabled=true;b.textContent='Menyimpan...';
try{const a=await claude.use('artifact');if(!a)throw{code:'none'};
const c=document.documentElement.cloneNode(true);
c.querySelector('#data').textContent=JSON.stringify({s:D.s,products:P,cats:D.cats,pay:D.pay}).replace(/</g,'\\u003c');
c.querySelector('#view').innerHTML='';c.querySelector('#top').innerHTML='';c.querySelectorAll('.md').forEach(e=>e.remove());
await a.publish('<!doctype html>\n'+c.outerHTML)}
catch(e){b.disabled=false;b.textContent=t;if(e&&e.code==='conflict')return;alert(e&&(e.code==='not_writer'||e.code==='not_granted')?'Akun ini tidak punya izin mengubah website.':'Gagal menyimpan. Coba lagi sebentar lagi.')}}
let RS=5;
const stars=()=>{$('#stp').innerHTML=[1,2,3,4,5].map(n=>`<button aria-label="${n} bintang" onclick="RS=${n};stars()" style="font-size:34px;color:${n<=RS?'#F3B62E':'var(--line)'}">★</button>`).join('')};
function revForm(id){const o=S.orders.find(x=>x.id===id);if(!o)return;if(o.rv){alert('Kamu sudah mengirim ulasan untuk pesanan ini. Terima kasih!');return}RS=5;
const m=document.createElement('div');m.className='md';m.innerHTML=`<div class="card" style="text-align:left;width:100%;max-width:380px"><h2 style="color:var(--deep)">Beri ulasan</h2><p class="hint">${esc(o.n)} · ${esc(o.id)}</p><div id="stp"></div><label class="lb" for="rn">Nama (boleh inisial)</label><input class="in" id="rn" maxlength="30"><label class="lb" for="rt">Ulasanmu</label><textarea class="in" id="rt" maxlength="200" placeholder="Ceritakan pengalamanmu..."></textarea><p class="hint">Ulasan dikirim ke admin lewat WhatsApp dan tampil di website setelah disetujui admin.</p><a class="btn y w" id="rs" style="text-decoration:none;margin-bottom:8px" href="#" onclick="return sendRev('${o.id}')">Kirim ulasan lewat WhatsApp</a><button class="btn w" onclick="this.closest('.md').remove()">Batal</button></div>`;document.body.appendChild(m);stars()}
function sendRev(id){const o=S.orders.find(x=>x.id===id),n=$('#rn').value.trim(),t=$('#rt').value.trim();if(!n||t.length<5){alert('Isi nama dan ulasan dulu ya.');return false}
o.rv=1;save();const a=$('#rs');a.href=waLink('ULASAN PELANGGAN\nNama: '+n+'\nBintang: '+RS+'\nUlasan: '+t+'\nPesanan: '+o.id+' ('+o.n+')');a.target='_blank';a.rel='noopener';setTimeout(()=>{document.querySelector('.md').remove();route()},300);return true}
function pasteRev(){const t=$('#pr').value,g=k=>((t.match(new RegExp(k+': *(.*)','i'))||[])[1]||'').trim(),n=g('Nama'),u=g('Ulasan'),b=Math.min(5,Math.max(1,parseInt(g('Bintang'))||5));if(!n||!u){alert('Format tidak dikenali. Pastikan ada baris Nama: dan Ulasan:');return}ad('s.rev',[n,u,b])}
function route(){const h=location.hash.slice(1)||'beranda';hdr();let v;
if(h.startsWith('produk-')&&get(h.slice(7)))v=detail(get(h.slice(7)));
else if(h.startsWith('checkout-')&&get(h.slice(9)))v=checkout(get(h.slice(9)));
else if(h==='admin'&&isAdmin)v=adminView();
else v={beranda:home,katalog:cat,pesanan:ord,bantuan:help}[h]?.()||home();
$('#view').innerHTML=v;
if(h==='katalog')list();if(h==='pesanan')olist();
if(h.startsWith('checkout-')&&window._f){$('#wa').value=_f.wa}
}
let last='';addEventListener('hashchange',()=>{const h=location.hash;if(h.startsWith('#produk-')){S.pk=-1;S.qty=1;S.gf='all'}route();window.scrollTo(0,0)});route();
(async()=>{try{if(typeof claude==='undefined')return;const u=await claude.use('user');if(u&&u.canEdit()){isAdmin=true;route()}}catch(e){}})();
</script></body></html>
